<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Travel diary｜夢想環遊世界</title>
<style>
:root{
  --bg:#f7f8fb; --card:#fff; --text:#1f2530; --muted:#8b93a1; --line:#e9ecf2;
  --red:#f28c28; --red2:#e97817; --blue:#4285f4; --green:#2dbd79; --gold:#e7b442;
  --shadow:0 6px 18px rgba(27,37,54,.07); --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.header{padding:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:26px;font-weight:800;color:#f28c28}
.brand small{font-size:15px;color:#8a8f98;font-weight:600;margin-left:8px}
#today{background:#f7f8fb;min-height:calc(100vh - 135px)}
#today .section-title{color:var(--text)}
#today .card{box-shadow:var(--shadow)}
#today .quick{box-shadow:var(--shadow)}
.clickable-url{border:0;background:transparent;padding:0;color:#2f6fdd;text-decoration:underline;text-align:left;cursor:pointer;font-size:12px;word-break:break-all}
.btn.dangerbtn{background:#fff0ef;color:#d43c37;border:1px solid #ffd0cd}
.iconbtn{border:0;background:#fff;width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow);font-size:20px;cursor:pointer}
.page{display:none;padding:0 16px 24px}.page.active{display:block}
.hero{
  background:linear-gradient(135deg,#ff9f43,#e97817); color:#fff;border-radius:22px;padding:20px;
  box-shadow:0 12px 24px rgba(180,93,15,.22); margin:8px 0 14px
}
.hero .eyebrow{opacity:.8;font-size:13px}.hero .days{font-size:54px;font-weight:800;line-height:1.15;margin:2px 0}
.hero .trip-name{font-weight:800;font-size:18px;margin-bottom:8px}
.hero .sub{font-size:14px;opacity:.9;line-height:1.65}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.btn.light{background:rgba(255,255,255,.18);color:white}
.btn.primary{background:var(--red);color:white}.btn.blue{background:var(--blue);color:white}
.btn.soft{background:#f1f4f8;color:#4b5565}.btn.warn{background:#fff3d4;color:#956100}
.section-title{font-size:20px;font-weight:800;margin:22px 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{
  background:var(--card);padding:18px 16px;border-radius:18px;box-shadow:var(--shadow);min-height:112px;cursor:pointer;border:1px solid #f0f2f6
}
.quick .qicon{font-size:28px}.quick b{display:block;margin-top:8px}.quick span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid #f0f2f6}
.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.grow{flex:1}
.trip-selector{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.trip-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.trip-chip.active{background:var(--red);border-color:var(--red);color:#fff}
.day-card{padding:0;overflow:hidden}.day-head{padding:15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.day-badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#eaf2ff;color:#2f6fdd;font-size:22px}
.day-title{font-weight:800}.day-sub{font-size:13px;color:var(--muted)}
.actions{margin-left:auto;display:flex;gap:6px}
.mini{border:0;background:#f4f6f9;border-radius:10px;padding:7px 9px;cursor:pointer}
.item{padding:12px 15px;border-bottom:1px solid #f0f2f6;display:flex;gap:11px;align-items:flex-start}
.item:last-child{border-bottom:0}.time{width:58px;color:#9ba3b1;font-weight:700;font-size:13px;padding-top:2px}
.item-main{flex:1}.item-title{font-weight:750}.item-note{color:#89919f;font-size:12px;margin-top:3px;line-height:1.5}
.item-actions{display:flex;gap:4px}.item-actions button{border:0;background:transparent;cursor:pointer;font-size:16px}
.add-item{padding:13px 15px;display:flex;gap:8px}
input,textarea,select{
  width:100%;border:1px solid #dfe4eb;border-radius:12px;padding:11px 12px;font:inherit;background:white;color:var(--text)
}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;font-weight:700;display:block;margin:11px 0 6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link-card{display:flex;gap:12px;align-items:center}.link-icon{font-size:26px;width:38px;text-align:center}
.link-title{font-weight:800}.link-url{font-size:12px;color:var(--muted);word-break:break-all}
.link-actions{margin-left:auto;display:flex;gap:6px}
.money-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.expense{display:grid;grid-template-columns:84px 1fr 88px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.expense:last-child{border-bottom:0}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#f2f4f8;color:#687080;font-size:11px}
.bottom{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:10
}
.navbtn{border:0;background:transparent;padding:7px 2px;color:#9aa2af;font-size:11px;cursor:pointer}.navbtn .nicon{font-size:22px;display:block;margin-bottom:3px}
.navbtn.active{color:var(--red);font-weight:800}
.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:86px;width:54px;height:54px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:22px;box-shadow:0 10px 22px rgba(239,75,70,.35);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h3{margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px}
.small{font-size:12px}.danger{color:#d43c37}
@media (max-width:390px){.expense{grid-template-columns:70px 1fr 74px auto}.hero .days{font-size:46px}}

.auth-screen{position:fixed;inset:0;background:#f7f8fb;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.auth-screen.show{display:flex}
.auth-box{width:min(430px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 16px 50px rgba(20,30,45,.12)}
.auth-logo{font-size:30px;font-weight:900;color:#f28c28;margin-bottom:4px}
.auth-logo small{display:block;font-size:14px;color:#8a8f98;font-weight:600;margin-top:4px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.auth-tabs button{border:1px solid var(--line);background:#fff;padding:10px;border-radius:12px;font-weight:800;cursor:pointer}
.auth-tabs button.active{background:#fff3e6;border-color:#f28c28;color:#d96c08}
.cloud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aab1bd;margin-right:5px}
.cloud-dot.ok{background:#2dbd79}.cloud-dot.wait{background:#e7b442}.cloud-dot.err{background:#e34d4d}
.sync-state{font-size:12px;color:#7c8491;margin-left:8px}
.account-card{background:#fff8f1;border:1px solid #ffe0bd;border-radius:16px;padding:14px;margin:12px 0}
.share-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;margin-top:10px}
.member{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.notice{padding:11px 12px;border-radius:12px;background:#fff8e8;color:#7b5a12;font-size:12px;line-height:1.6;margin:10px 0}

</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Travel diary <small>夢想環遊世界</small></div>
    <div id="authCloudNotice" class="notice"></div>
    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="switchAuth('login')">登入</button>
      <button id="signupTab" onclick="switchAuth('signup')">建立帳號</button>
    </div>
    <div id="authNameWrap" style="display:none">
      <label>顯示名稱</label><input id="authName" placeholder="例如：Mila">
    </div>
    <label>Email</label><input id="authEmail" type="email" placeholder="name@example.com">
    <label>密碼</label><input id="authPassword" type="password" placeholder="至少 6 碼">
    <div class="btnrow">
      <button id="authSubmit" class="btn primary" style="flex:1" onclick="submitAuth()">登入</button>
      <button class="btn soft" onclick="useLocalMode()">先用本機模式</button>
    </div>
    <button class="btn soft" style="width:100%;margin-top:8px" onclick="forgotPassword()">忘記密碼</button>
    <div id="authMsg" class="muted" style="margin-top:12px;line-height:1.6"></div>
  </div>
</div>

<div class="app">
  <header class="header">
    <div class="brand">Travel diary <small>夢想環遊世界</small></div>
    <div class="row"><span id="syncState" class="sync-state"><span class="cloud-dot"></span>本機</span><button class="iconbtn" onclick="openAccount()" title="我的帳號">👤</button><button class="iconbtn" onclick="openTripManager()" title="管理行程">⚙️</button></div>
  </header>

  <main>
    <section id="today" class="page active">
      <div id="hero"></div>
      <div class="section-title">快速連結</div>
      <div class="grid">
        <div class="quick" onclick="showPage('travelInfo')"><div class="qicon">✈️</div><b>機票 & 飯店</b><span>建立自己的訂房與航班資訊</span></div>
        <div class="quick" onclick="showPage('itinerary')"><div class="qicon">📍</div><b>完整行程</b><span>每天行程可編輯、複製</span></div>
        <div class="quick" onclick="showPage('tools')"><div class="qicon">🕘</div><b>實用工具</b><span>匯率、交通、支付與自訂連結</span></div>
        <div class="quick" onclick="showPage('ledger')"><div class="qicon">💰</div><b>記帳</b><span>可新增、修改、刪除支出</span></div>
      </div>
      <div class="section-title">目前行程</div>
      <div id="todayPreview"></div>
    </section>

    <section id="itinerary" class="page">
      <div class="section-title">完整行程</div>
      <div id="tripSelector1" class="trip-selector"></div>
      <div class="row space" style="margin-bottom:12px">
        <div class="muted">目前選擇的整趟旅程</div>
        <button class="btn dangerbtn" onclick="deleteCurrentTrip()">🗑 刪除整趟行程</button>
      </div>
      <div id="itineraryList"></div>
      <button class="btn primary" onclick="addDay()">＋ 新增一天</button>
    </section>

    <section id="travelInfo" class="page">
      <div class="section-title">機票 & 飯店</div>
      <div id="tripSelector2" class="trip-selector"></div>
      <div id="travelLinks"></div>
      <button class="btn primary" onclick="openLinkEditor('travel')">＋ 新增資訊</button>
    </section>

    <section id="ledger" class="page">
      <div class="section-title">旅遊記帳</div>
      <div id="tripSelector3" class="trip-selector"></div>
      <div id="moneySummary" class="money-summary"></div>
      <div class="card" style="margin-top:12px">
        <div class="row space"><b>支出明細</b><button class="btn primary" onclick="openExpenseEditor()">＋ 新增</button></div>
        <div id="expenseList"></div>
      </div>
    </section>

    <section id="tools" class="page">
      <div class="section-title">實用工具</div>
      <div id="tripSelector4" class="trip-selector"></div>
      <div id="toolLinks"></div>
      <button class="btn primary" onclick="openLinkEditor('tools')">＋ 新增工具</button>
    </section>
  </main>
</div>

<button class="fab" onclick="quickAdd()" title="快速新增">✈</button>

<nav class="bottom">
  <button class="navbtn active" data-page="today" onclick="showPage('today')"><span class="nicon">🗓️</span>今日</button>
  <button class="navbtn" data-page="itinerary" onclick="showPage('itinerary')"><span class="nicon">🧳</span>行程</button>
  <button class="navbtn" data-page="travelInfo" onclick="showPage('travelInfo')"><span class="nicon">📍</span>資訊</button>
  <button class="navbtn" data-page="ledger" onclick="showPage('ledger')"><span class="nicon">👛</span>記帳</button>
  <button class="navbtn" data-page="tools" onclick="showPage('tools')"><span class="nicon">☰</span>更多</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head"><div><h3 id="modalTitle">編輯</h3><div id="modalHint" class="muted"></div></div><button class="iconbtn" onclick="closeModal()">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='victrip_interactive_v2';
const CLOUD_CONFIG_KEY='travel_diary_supabase_config';
let cloudClient=null;
let cloudUser=null;
let authMode='login';
let localOnly=false;
let cloudSaveTimer=null;

function getCloudConfig(){
  try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')}catch(e){return {}}
}
function setCloudConfig(url,key){
  localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url:url.trim(),key:key.trim()}));
}
function cloudConfigured(){
  const c=getCloudConfig();
  return !!(c.url && c.key && c.url.startsWith('http'));
}
function initCloud(){
  if(!cloudConfigured() || !window.supabase){cloudClient=null;return false}
  const c=getCloudConfig();
  cloudClient=window.supabase.createClient(c.url,c.key,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  return true;
}
function setSyncState(text,state=''){
  const el=document.getElementById('syncState'); if(!el)return;
  el.innerHTML=`<span class="cloud-dot ${state}"></span>${escapeHTML(text)}`;
}

const seed={
  selectedTripId:'shanghai',
  trips:[
    {
      id:'shanghai', name:'上海・杭州・蘇州', start:'2026-10-15', end:'2026-10-24',
      outbound:'BR712 09:55 桃園 T2 → 12:05 浦東 T2', inbound:'BR721 20:05 浦東 → 22:00 桃園',
      days:[
        {date:'2026-10-15', title:'出發！上海第一晚', items:[
          {time:'09:55',title:'桃園機場出發',note:'BR712｜桃園 T2 → 上海浦東 T2'},
          {time:'13:30',title:'前往飯店 Check-in',note:'放行李、稍作休息'},
          {time:'17:30',title:'上海散步',note:'南京東路／外灘夜景'}
        ]},
        {date:'2026-10-16', title:'包車去杭州・西湖湖濱', items:[
          {time:'08:30',title:'退房＋行李上車',note:''},
          {time:'09:00',title:'包車出發：上海 → 杭州',note:'約 200km／3 小時'},
          {time:'12:30',title:'五星灣酒店 Check-in',note:'湖濱商圈，出門就是西湖'},
          {time:'14:00',title:'西湖湖濱散步',note:'湖濱步道、集賢亭、音樂噴泉'},
          {time:'17:00',title:'河坊街',note:'老街小吃＋伴手禮'},
          {time:'18:30',title:'晚餐：杭幫菜',note:'東坡肉、西湖醋魚'},
          {time:'20:00',title:'西湖夜景散步',note:'飯店就在湖邊'}
        ]},
        {date:'2026-10-17', title:'杭州全日：靈隱寺＋西湖', items:[
          {time:'08:00',title:'靈隱寺＋飛來峰',note:'上午人較少'},
          {time:'12:00',title:'午餐',note:'靈隱周邊'},
          {time:'14:30',title:'雷峰塔',note:'俯瞰西湖全景'},
          {time:'17:30',title:'西湖日落',note:'蘇堤／湖濱'}
        ]}
      ],
      travelLinks:[
        {icon:'✈️',title:'BR712 去程航班',url:'https://www.evaair.com/',note:'10/15 桃園 → 上海'},
        {icon:'✈️',title:'BR721 回程航班',url:'https://www.evaair.com/',note:'10/24 上海 → 桃園'},
        {icon:'🏨',title:'上海飯店',url:'',note:'請貼上自己的訂房連結'},
        {icon:'🏨',title:'杭州飯店',url:'',note:'請貼上自己的訂房連結'}
      ],
      tools:[
        {icon:'💱',title:'匯率換算',url:'https://www.xe.com/',note:'人民幣／新台幣'},
        {icon:'🚕',title:'交通資訊',url:'',note:'可建立叫車、地鐵、包車連結'},
        {icon:'💳',title:'支付資訊',url:'',note:'支付寶／微信支付備忘'},
        {icon:'🛡️',title:'緊急資訊',url:'',note:'保險、聯絡人、醫療資訊'}
      ],
      expenses:[
        {date:'2026-10-15',category:'交通',title:'機場交通',amount:900},
        {date:'2026-10-16',category:'交通',title:'上海→杭州包車',amount:3200}
      ]
    },
    {
      id:'japan', name:'富士山・山梨', start:'2026-10-08', end:'2026-10-12',
      outbound:'自訂航班', inbound:'自訂回程',
      days:[{date:'2026-10-08',title:'抵達日本・前往山梨',items:[
        {time:'10:00',title:'抵達機場',note:'領車／交通移動'},
        {time:'14:00',title:'河口湖',note:'富士山景觀散步'}
      ]}],
      travelLinks:[], tools:[], expenses:[]
    }
  ]
};
let data=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
 if(cloudUser && !localOnly) scheduleCloudSync();
}
function scheduleCloudSync(){
 clearTimeout(cloudSaveTimer);
 setSyncState('同步中','wait');
 cloudSaveTimer=setTimeout(()=>syncAllTripsToCloud(),650);
}
function trip(){return data.trips.find(t=>t.id===data.selectedTripId)||data.trips[0]}
function fmtDate(s){if(!s)return''; const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function weekday(s){return ['日','一','二','三','四','五','六'][new Date(s+'T00:00:00').getDay()]}
function daysUntil(s){const now=new Date(); now.setHours(0,0,0,0); const d=new Date(s+'T00:00:00'); return Math.ceil((d-now)/86400000)}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openUrl(url){
 if(!url){alert('尚未建立連結。');return}
 let target=url.trim();
 if(target && !/^https?:\/\//i.test(target) && !target.startsWith('blob:')) target='https://'+target;
 window.open(target,'_blank','noopener');
}
function openSavedLink(type,index){
 const arr=type==='travel'?trip().travelLinks:trip().tools;
 const x=arr[index];
 if(!x)return;
 if(x.url && x.url.trim()){
   openUrl(x.url);
   return;
 }
 modal(x.title||'已儲存資訊',
   `<div class="card" style="box-shadow:none;margin-top:12px">
      <div style="white-space:pre-wrap;line-height:1.8">${escapeHTML(x.note||'目前只有標題，尚未填寫內容。')}</div>
    </div>`,
   '這是你儲存在此旅程中的資訊。');
}
function showPage(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));
 document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
 window.scrollTo({top:0,behavior:'smooth'});
}
function renderSelectors(){
 ['tripSelector1','tripSelector2','tripSelector3','tripSelector4'].forEach(id=>{
  const el=document.getElementById(id); if(!el)return;
  el.innerHTML=data.trips.map(t=>`<button class="trip-chip ${t.id===data.selectedTripId?'active':''}" onclick="selectTrip('${t.id}')">${escapeHTML(t.name)}</button>`).join('');
 })
}
function selectTrip(id){data.selectedTripId=id;save()}
function renderHero(){
 const t=trip(), n=daysUntil(t.start);
 document.getElementById('hero').innerHTML=`<div class="hero">
  <div class="eyebrow">距離此趟旅程還有</div>
  <div class="days">${n>=0?n:0} 天</div>

async function deleteCurrentTrip(){
 const current=trip();
 if(!current)return;
 if(!confirm(`確定要完整刪除「${current.name}」嗎？\n\n此操作會一併刪除：每日行程、機票飯店、實用工具與記帳資料。`)) return;

 if(cloudUser && cloudClient && !localOnly){
   try{
     if(current._role && current._role!=='owner'){
       const {error}=await cloudClient.from('trip_members').delete().eq('trip_id',current.id).eq('user_id',cloudUser.id);
       if(error) throw error;
     }else{
       const {error}=await cloudClient.from('trips').delete().eq('id',current.id);

     }
   }catch(e){alert('雲端刪除失敗：'+e.message);return}

async function submitAuth(){

 if(!cloudClient)initCloud();
 const email=document.getElementById('authEmail').value.trim();

 if(!email||!password){document.getElementById('authMsg').textContent='請輸入 Email 與密碼。';return}
 document.getElementById('authMsg').textContent='處理中…';
 try{
   if(authMode==='signup'){
     const redirectTo=location.origin+location.pathname;
     const {data:res,error}=await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:redirectTo,data:{display_name:name}}});
     if(error)throw error;
     document.getElementById('authMsg').textContent=res.session?'帳號建立完成，正在登入…':'帳號建立完成，請到 Email 點驗證信後再登入。';
     if(res.session){cloudUser=res.user;await afterLogin()}
   }else{
     const {data:res,error}=await cloudClient.auth.signInWithPassword({email,password});
     if(error)throw error; cloudUser=res.user; await afterLogin();
   }
 }catch(e){document.getElementById('authMsg').textContent='失敗：'+e.message}
}

function cleanTripForCloud(t){
 const x=JSON.parse(JSON.stringify(t));
 delete x._ownerId; delete x._role; delete x._members;
 return x;
}
async function syncAllTripsToCloud(){
 if(!cloudClient||!cloudUser||localOnly)return;
 try{
   for(const t of data.trips){
     if(t._role && t._role==='viewer')continue;
     const payload=cleanTripForCloud(t);
     if(t._role && t._role!=='owner'){
       const {error}=await cloudClient.from('trips').update({name:t.name,payload,updated_at:new Date().toISOString()}).eq('id',t.id);
       if(error)throw error;
     }else{
       const {error}=await cloudClient.from('trips').upsert({
         id:t.id,owner_id:t._ownerId||cloudUser.id,name:t.name,payload,updated_at:new Date().toISOString()
       },{onConflict:'id'});
       if(error)throw error;
       t._ownerId=t._ownerId||cloudUser.id;t._role=t._role||'owner';
     }
   }
   localStorage.setItem(KEY,JSON.stringify(data));
   setSyncState('已同步','ok');
 }catch(e){
   setSyncState('同步失敗','err');
   console.error(e);
 }
}
async function loadCloudTrips(){
 if(!cloudClient||!cloudUser)return;
 const {data:rows,error}=await cloudClient.from('trips').select('id,owner_id,name,payload,updated_at');
 if(error){setSyncState('載入失敗','err');console.error(error);return}
 if(rows && rows.length){
   const cloudTrips=[];
   for(const r of rows){
     const t=typeof r.payload==='string'?JSON.parse(r.payload):r.payload;
     t.id=r.id;t.name=r.name||t.name;t._ownerId=r.owner_id;
     t._role=r.owner_id===cloudUser.id?'owner':'editor';
     cloudTrips.push(t);
   }
   data.trips=cloudTrips;
   if(!data.trips.find(t=>t.id===data.selectedTripId))data.selectedTripId=data.trips[0].id;
   localStorage.setItem(KEY,JSON.stringify(data));
   render();
 }else if(data.trips.length){
   await syncAllTripsToCloud();
 }
}

 if(error){alert(error.message);return}loadMembers();

async function bootCloud(){
 if(!initCloud()){showAuth();setSyncState('未設定','');return}
 const {data:{session}}=await cloudClient.auth.getSession();
 if(session?.user){cloudUser=session.user;await afterLogin()}else{showAuth();setSyncState('未登入','')}
 cloudClient.auth.onAuthStateChange(async(event,session)=>{
   if(session?.user && (!cloudUser||cloudUser.id!==session.user.id)){cloudUser=session.user;await afterLogin()}
   if(event==='SIGNED_OUT'){cloudUser=null;showAuth();setSyncState('未登入','')}
   if(event==='PASSWORD_RECOVERY'){
     const pwd=prompt('請輸入新密碼（至少 6 碼）');
     if(pwd){const {error}=await cloudClient.auth.updateUser({password:pwd});alert(error?error.message:'密碼已更新。')}
   }
 });
}

render();
bootCloud();
</script>
